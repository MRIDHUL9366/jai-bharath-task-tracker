<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Prevent Aggressive Mobile Browser Caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Group Task Race</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <header class="header">
    <h1 class="title">GROUP TASK RACE</h1>
    <p class="subtitle">Track. Compete. Complete.</p>
    <nav class="nav">
      <button class="nav-btn active" data-section="dashboard">Dashboard</button>
      <button class="nav-btn" data-section="groups">Groups</button>
      <button class="nav-btn" data-section="tasks">Tasks</button>
    </nav>
  </header>

  <main class="main">
    <!-- Dashboard Section -->
    <section id="dashboard" class="section">
      <div class="summary-cards" id="summary-cards"></div>
      <div class="leaderboard" id="leaderboard"></div>
      <div class="progress-bars" id="progress-bars"></div>
    </section>

    <!-- Groups Section -->
    <section id="groups" class="section hidden">
      <div class="search-box">
        <input type="text" id="group-search" placeholder="Search Groups..." />
      </div>
      <div class="group-cards" id="group-cards"></div>
    </section>

    <!-- Tasks Section -->
    <section id="tasks" class="section hidden">
      <div class="task-list" id="task-list"></div>
    </section>
  </main>

  <!-- Modal for Group Details -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="group-modal">
      <button class="modal-close" id="modal-close">✖</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Theme Switcher (Floating) -->
  <div class="theme-switcher" id="theme-switcher">
    <div class="theme-swatches" id="theme-swatches">
      <button class="theme-swatch swatch-light active" data-theme="light" data-tooltip="Light Teal" aria-label="Light theme"></button>
      <button class="theme-swatch swatch-dark" data-theme="dark" data-tooltip="Dark Obsidian" aria-label="Dark theme"></button>
      <button class="theme-swatch swatch-sunset" data-theme="sunset" data-tooltip="Sunset Blaze" aria-label="Sunset theme"></button>
      <button class="theme-swatch swatch-ocean" data-theme="ocean" data-tooltip="Ocean Deep" aria-label="Ocean theme"></button>
      <button class="theme-swatch swatch-neon" data-theme="neon" data-tooltip="Neon Cyber" aria-label="Neon theme"></button>
    </div>
    <button class="theme-toggle-btn" id="theme-toggle-btn" aria-label="Switch theme">🎨</button>
  </div>

  <!-- Theme Initialization (runs BEFORE anything else renders) -->
  <script>
    (function initTheme() {
      const saved = localStorage.getItem('gtr-theme');
      if (saved && saved !== 'light') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    })();
  </script>

  <script>
    (function () {
      // Generate a unique timestamp query parameter on every page load
      const timestamp = new Date().getTime();

      // Dynamically load CSS with anti-cache query param
      const links = document.querySelectorAll('link[rel="stylesheet"]');
      links.forEach(link => {
        if (link.href && link.href.includes('css/style.css')) {
          link.href = link.href.split('?')[0] + '?v=' + timestamp;
        }
      });

      function loadScript(src, callback) {
        const script = document.createElement('script');
        script.src = src + '?v=' + timestamp;
        script.onload = callback;
        document.body.appendChild(script);
      }

      // Load data.js first (fresh each time), then load performer.js and app.js
      loadScript('js/data.js', function () {
        loadScript('js/performer.js', function () {
          loadScript('js/app.js', function () {
            if (typeof init === 'function') {
              init();
            }
            // Initialize theme switcher after app is ready
            initThemeSwitcher();
          });
        });
      });

      function initThemeSwitcher() {
        const switcher = document.getElementById('theme-switcher');
        const toggleBtn = document.getElementById('theme-toggle-btn');
        const swatches = document.querySelectorAll('.theme-swatch');

        // Restore active swatch from localStorage
        const currentTheme = localStorage.getItem('gtr-theme') || 'light';
        swatches.forEach(function (sw) {
          sw.classList.toggle('active', sw.dataset.theme === currentTheme);
        });

        // Toggle panel open/close
        toggleBtn.addEventListener('click', function () {
          switcher.classList.toggle('open');
        });

        // Close panel when clicking outside
        document.addEventListener('click', function (e) {
          if (!switcher.contains(e.target)) {
            switcher.classList.remove('open');
          }
        });

        // Switch theme on swatch click
        swatches.forEach(function (sw) {
          sw.addEventListener('click', function () {
            var theme = sw.dataset.theme;

            // Update data-theme attribute
            if (theme === 'light') {
              document.documentElement.removeAttribute('data-theme');
            } else {
              document.documentElement.setAttribute('data-theme', theme);
            }

            // Update active state
            swatches.forEach(function (s) { s.classList.remove('active'); });
            sw.classList.add('active');

            // Persist choice
            localStorage.setItem('gtr-theme', theme);

            // Rotate the palette icon for feedback
            toggleBtn.style.transform = 'rotate(360deg)';
            setTimeout(function () {
              toggleBtn.style.transform = '';
            }, 400);
          });
        });
      }
    })();
  </script>
</body>

</html>

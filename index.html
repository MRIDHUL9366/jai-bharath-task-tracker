<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Group Task Race</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <!-- Chart.js CDN (v4) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

<body>
  <header class="header">
    <h1 class="title">GROUP TASK RACE</h1>
    <p class="subtitle">Track. Compete. Complete.</p>
    <nav class="nav">
      <button class="nav-btn active" data-section="dashboard">Dashboard</button>
      <button class="nav-btn" data-section="groups">Groups</button>
      <button class="nav-btn" data-section="tasks">Tasks</button>
    </nav>
  </header>

  <main class="main">
    <!-- Dashboard Section -->
    <section id="dashboard" class="section">
      <div class="summary-cards" id="summary-cards"></div>
      <div class="current-leader" id="current-leader"></div>
      <div class="leaderboard" id="leaderboard"></div>
      <div class="progress-bars" id="progress-bars"></div>
      <div class="chart-container" id="chart-container">
        <canvas id="groupChart"></canvas>
      </div>
    </section>

    <!-- Groups Section -->
    <section id="groups" class="section hidden">
      <div class="search-box">
        <input type="text" id="group-search" placeholder="Search Groups..." />
      </div>
      <div class="group-cards" id="group-cards"></div>
    </section>

    <!-- Tasks Section -->
    <section id="tasks" class="section hidden">
      <div class="task-list" id="task-list"></div>
    </section>
  </main>

  <!-- Modal for Group Details -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="group-modal">
      <button class="modal-close" id="modal-close">✖</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Data and App Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
